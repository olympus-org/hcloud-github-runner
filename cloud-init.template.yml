#cloud-config
packages:
  - curl
  - git
  - gzip
  - jq
  - tar
package_update: true
package_upgrade: false
runcmd:
  - udevadm trigger -c add -s block -p ID_VENDOR=HC -p ID_MODEL=Volume
  - export RUNNER_ALLOW_RUNASROOT=1
  - bash $MY_RUNNER_DIR/pre_runner_script.sh
  - |
    bash -lc '
      set -euo pipefail

      bash "$MY_RUNNER_DIR/install.sh" -v "$MY_RUNNER_VERSION" -d "$MY_RUNNER_DIR"

      if [[ "$MY_RUNNER_COUNT" -le 1 ]]; then
        "$MY_RUNNER_DIR/config.sh" --url "https://github.com/${MY_GITHUB_REPOSITORY}" --token "${MY_GITHUB_RUNNER_REGISTRATION_TOKEN}" --name "${MY_NAME}" --labels "${MY_NAME},hetzner" --no-default-labels --disableupdate
        "$MY_RUNNER_DIR/run.sh"
      else
        install -d /opt/actions-runner-template
        cp -a "$MY_RUNNER_DIR/." /opt/actions-runner-template/

        for i in $(seq 1 "$MY_RUNNER_COUNT"); do
          RUNNER_INSTANCE_DIR="${MY_RUNNER_DIR}-${i}"
          RUNNER_INSTANCE_NAME="${MY_NAME}-${i}"

          rm -rf "$RUNNER_INSTANCE_DIR"
          mkdir -p "$RUNNER_INSTANCE_DIR"
          cp -a /opt/actions-runner-template/. "$RUNNER_INSTANCE_DIR/"

          "$RUNNER_INSTANCE_DIR/config.sh" --unattended --replace --url "https://github.com/${MY_GITHUB_REPOSITORY}" --token "${MY_GITHUB_RUNNER_REGISTRATION_TOKEN}" --name "$RUNNER_INSTANCE_NAME" --labels "${RUNNER_INSTANCE_NAME},${MY_NAME},hetzner" --no-default-labels --disableupdate
          "$RUNNER_INSTANCE_DIR/svc.sh" install
          "$RUNNER_INSTANCE_DIR/svc.sh" start
        done
      fi
    '
write_files:
  - path: $MY_RUNNER_DIR/pre_runner_script.sh
    encoding: b64
    content: $MY_PRE_RUNNER_SCRIPT_BASE64
  - path: $MY_RUNNER_DIR/install.sh
    encoding: b64
    content: $MY_INSTALL_SH_BASE64
